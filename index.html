<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li💗U</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="rgba(255,105,180,0.7)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0;
            animation: fall 10s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10%) translateX(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(20px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            z-index: -1;
            border-radius: 25px;
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #e75480;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #8a2be2;
            margin-bottom: 30px;
        }

        .countdown-container {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
        }

        #show {
            font-size: 2.2rem;
            color: #d53a9d;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        .heart-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            animation: float 3s ease-in-out forwards;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }

        .footer {
            margin-top: 30px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: #8a2be2;
        }

        .firework-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .firework-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
        }

        .pony-burst-photo {
            position: absolute;
            width: 110px;
            height: 140px;
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid #fff;
            box-shadow: 0 8px 24px rgba(231, 84, 128, 0.45);
            opacity: 0;
            will-change: transform, opacity;
            transform-origin: center center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                width: 95%;
            }

            h1 {
                font-size: 3rem;
            }

            #show {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1.5rem;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pony-burst-photo {
                width: 78px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
<div class="hearts-container" id="hearts"></div>
<div class="firework-layer" id="firework-layer"></div>

<div class="container">
    <div class="header">
        <h1>Li💗U</h1>
        <div class="subtitle">Our Love Journey Time Machine</div>
    </div>

    <div class="countdown-container">
        <h3 id="show"></h3>
    </div>

<!--     <div class="photo-container">
        <img id="slideshow-img" src="images/1.jpg" alt="Slideshow Image">
    </div> -->

    <div class="footer">Forever and Always</div>
</div>

<script>
    // 创建心形飘落效果
    function createHearts() {
        const heartsContainer = document.getElementById('hearts');
        const heartCount = 15;

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            // 随机位置和动画延迟
            const left = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = 8 + Math.random() * 5;
            const size = 15 + Math.random() * 20;

            heart.style.left = `${left}%`;
            heart.style.animationDelay = `${delay}s`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;

            heartsContainer.appendChild(heart);
        }
    }

    // 创建漂浮的心形图标
    function createFloatingHeart() {
        const countdownContainer = document.querySelector('.countdown-container');
        const heart = document.createElement('div');
        heart.innerHTML = '💖';
        heart.classList.add('heart-icon');

        // 随机位置
        const left = 20 + Math.random() * 60;
        heart.style.left = `${left}%`;

        countdownContainer.appendChild(heart);

        // 动画结束后移除元素
        setTimeout(() => {
            heart.remove();
        }, 3000);
    }

    // 创建倒计时文本
    function createCountdownTexts() {
        // 创建一个新的Date实例，表示2024年7月20日
        var targetDate = new Date(2024, 6, 20);
        var currentDate = new Date();
        var diffMilliseconds = targetDate.getTime() - currentDate.getTime();
        var diffDays = Math.abs(Math.floor(diffMilliseconds / (1000 * 60 * 60 * 24)));

        const rk = new Date(2024, 10, 9);
        var rkDiffMilliseconds = rk.getTime() - currentDate.getTime();
        var rkDiffDays = Math.abs(Math.floor(rkDiffMilliseconds / (1000 * 60 * 60 * 24)));

        const qh = new Date(2025, 2, 22);
        var qhDiffMilliseconds = qh.getTime() - currentDate.getTime();
        var qhDiffDays = Math.abs(Math.floor(qhDiffMilliseconds / (1000 * 60 * 60 * 24)));

        const lz = new Date(2025, 6, 20);
        var lzDiffMilliseconds = lz.getTime() - currentDate.getTime();
        var lzDiffDays = Math.abs(Math.floor(lzDiffMilliseconds / (1000 * 60 * 60 * 24)));

        const pony = new Date(2026, 10, 10, 6, 13);
        var ponyDiffMilliseconds = Math.abs(pony.getTime() - currentDate.getTime());
        var ponyDiffDays = Math.floor(ponyDiffMilliseconds / (1000 * 60 * 60 * 24));
        var ponyDiffHours = Math.floor((ponyDiffMilliseconds % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var ponyDiffMinutes = Math.floor((ponyDiffMilliseconds % (1000 * 60 * 60)) / (1000 * 60));

        return [
            {
                type: 'meet',
                text: `💕 距2024年07月20日见面: ${diffDays}天`
            },
            {
                type: 'pony',
                text: `🍼 小马（Pony）出生：2026年11月10日上午6:13 \n已到来: ${ponyDiffDays}天${ponyDiffHours}时${ponyDiffMinutes}分`
            }
        ];
    }

    const PONY_PHOTOS = ['pony/1.jpg', 'pony/2.jpg', 'pony/3.jpg'];
    const FIREWORK_COLORS = ['#ff6b9d', '#ffd166', '#7bdff2', '#b388ff', '#ff8fab', '#fff1a8', '#ff4d6d'];

    function launchFireworkBurst(layer, originX, originY) {
        const particleCount = 28 + Math.floor(Math.random() * 12);

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework-particle';

            const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.3;
            const distance = 80 + Math.random() * 160;
            const size = 4 + Math.random() * 7;
            const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
            const duration = 700 + Math.random() * 700;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;

            particle.style.left = `${originX}px`;
            particle.style.top = `${originY}px`;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.background = color;
            particle.style.boxShadow = `0 0 8px ${color}`;

            layer.appendChild(particle);

            const animation = particle.animate([
                {
                    transform: 'translate(-50%, -50%) scale(1)',
                    opacity: 1
                },
                {
                    transform: `translate(calc(-50% + ${dx * 0.55}px), calc(-50% + ${dy * 0.55}px)) scale(1.2)`,
                    opacity: 1,
                    offset: 0.35
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.2)`,
                    opacity: 0
                }
            ], {
                duration,
                easing: 'cubic-bezier(0.15, 0.75, 0.25, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => particle.remove();
        }
    }

    function launchPonyPhotoBurst(layer) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const photoCount = PONY_PHOTOS.length;

        PONY_PHOTOS.forEach((src, index) => {
            const img = document.createElement('img');
            img.className = 'pony-burst-photo';
            img.src = src;
            img.alt = '小马 Pony';

            const angle = (-Math.PI / 2) + (index - (photoCount - 1) / 2) * 0.9 + (Math.random() - 0.5) * 0.25;
            const distance = Math.min(window.innerWidth, window.innerHeight) * (0.22 + Math.random() * 0.12);
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance - 40;
            const rotate = (index - 1) * 18 + (Math.random() - 0.5) * 16;
            const delay = index * 80;

            img.style.left = `${centerX}px`;
            img.style.top = `${centerY}px`;

            layer.appendChild(img);

            const animation = img.animate([
                {
                    transform: 'translate(-50%, -50%) scale(0.15) rotate(0deg)',
                    opacity: 0
                },
                {
                    transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7}px)) scale(1.08) rotate(${rotate}deg)`,
                    opacity: 1,
                    offset: 0.35
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${rotate}deg)`,
                    opacity: 1,
                    offset: 0.7
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy - 30}px)) scale(0.85) rotate(${rotate + 8}deg)`,
                    opacity: 0
                }
            ], {
                duration: 2600,
                delay,
                easing: 'cubic-bezier(0.16, 0.84, 0.28, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => img.remove();
        });
    }

    function celebratePony() {
        const layer = document.getElementById('firework-layer');
        if (!layer) return;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        launchFireworkBurst(layer, centerX, centerY);
        launchPonyPhotoBurst(layer);

        const sideBursts = [
            [centerX - 140, centerY - 60],
            [centerX + 140, centerY - 40],
            [centerX, centerY + 90]
        ];

        sideBursts.forEach(([x, y], index) => {
            setTimeout(() => {
                launchFireworkBurst(
                    layer,
                    x + (Math.random() - 0.5) * 40,
                    y + (Math.random() - 0.5) * 40
                );
            }, 180 + index * 160);
        });
    }

    // 初始化页面
    function initPage() {
        createHearts();

        const txts = createCountdownTexts();
        let i = 0;
        const showElement = document.getElementById('show');

        // 初始显示
        showElement.innerHTML = txts[i].text;
        showElement.style.opacity = 1;

        // 设置定时器切换文本
        setInterval(function () {
            // 淡出效果
            showElement.style.opacity = 0;

            setTimeout(() => {
                i = (i + 1) % txts.length;
                showElement.innerHTML = txts[i].text;

                // 淡入效果
                setTimeout(() => {
                    showElement.style.opacity = 1;
                }, 50);

                // 创建漂浮的心形
                createFloatingHeart();

                if (txts[i].type === 'pony') {
                    celebratePony();
                }
            }, 500);
        }, 5000);

        const images = ['1.jpg', '2.jpg', '3.jpg', '4.jpg'];
        let currentIndex = 0;
        const imgElement = document.getElementById('slideshow-img');

        if (imgElement) {
            function changeImage() {
                currentIndex = (currentIndex + 1) % images.length;
                imgElement.src = `images/${images[currentIndex]}`;
            }

            setInterval(changeImage, 2000);
        }
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
