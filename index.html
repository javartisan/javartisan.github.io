<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li💗U</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="rgba(255,105,180,0.7)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0;
            animation: fall 10s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10%) translateX(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(20px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            z-index: -1;
            border-radius: 25px;
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #e75480;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #8a2be2;
            margin-bottom: 30px;
        }

        .countdown-container {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            padding: 20px 0 16px;
            margin: 20px 0;
            min-height: 240px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            cursor: grab;
        }

        .countdown-container.is-dragging {
            cursor: grabbing;
        }

        .carousel-viewport {
            overflow: hidden;
            width: 100%;
            padding: 8px 0 4px;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            will-change: transform;
            transition: transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .carousel-track.is-dragging {
            transition: none;
        }

        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            padding: 8px 24px 12px;
            box-sizing: border-box;
            color: #d53a9d;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            min-height: 14px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(213, 58, 157, 0.28);
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .carousel-dot.is-active {
            background: #d53a9d;
            transform: scale(1.25);
        }

        .carousel-hint {
            text-align: center;
            margin-top: 8px;
            font-size: 0.82rem;
            color: #b07a9a;
            letter-spacing: 1px;
        }

        .slide {
            width: 100%;
            text-align: center;
        }

        .slide-eyebrow {
            font-family: 'Dancing Script', cursive;
            font-size: 1.35rem;
            color: #8a2be2;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .slide-title {
            font-size: 1.15rem;
            color: #a14d7c;
            font-weight: 400;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .slide-value {
            font-size: 2.6rem;
            font-weight: 700;
            color: #d53a9d;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.08);
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .slide-value .unit {
            font-size: 1.2rem;
            margin-left: 4px;
            font-weight: 700;
        }

        .slide-meta {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #9b6b8a;
        }

        .time-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .time-chip {
            min-width: 72px;
            padding: 10px 12px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 12px rgba(213, 58, 157, 0.12);
        }

        .time-chip .num {
            display: block;
            font-size: 1.55rem;
            font-weight: 700;
            color: #d53a9d;
            line-height: 1.1;
        }

        .time-chip .label {
            display: block;
            margin-top: 4px;
            font-size: 0.78rem;
            color: #9b6b8a;
            letter-spacing: 1px;
        }

        .life-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }

        .life-card {
            background: rgba(255, 255, 255, 0.78);
            border-radius: 14px;
            padding: 16px 12px;
            box-shadow: 0 4px 14px rgba(213, 58, 157, 0.1);
        }

        .life-card-icon {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .life-card-label {
            font-family: 'Dancing Script', cursive;
            font-size: 1.25rem;
            color: #8a2be2;
            margin-bottom: 10px;
        }

        .life-card-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: #d53a9d;
            line-height: 1.55;
            word-break: break-word;
        }

        .life-card-value .seg {
            display: inline-block;
            margin: 0 2px;
            white-space: nowrap;
        }

        .heart-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            animation: float 3s ease-in-out forwards;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }

        .footer {
            margin-top: 30px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: #8a2be2;
        }

        .firework-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .firework-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
        }

        .pony-burst-photo {
            position: absolute;
            width: 110px;
            height: 140px;
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid #fff;
            box-shadow: 0 8px 24px rgba(231, 84, 128, 0.45);
            opacity: 0;
            will-change: transform, opacity;
            transform-origin: center center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                width: 95%;
            }

            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.5rem;
            }

            .countdown-container {
                min-height: 260px;
                padding: 16px 0 12px;
            }

            .carousel-slide {
                padding: 8px 14px 12px;
            }

            .slide-value {
                font-size: 2.1rem;
            }

            .life-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .life-card-value {
                font-size: 0.98rem;
            }

            .time-chip {
                min-width: 62px;
                padding: 8px 10px;
            }

            .time-chip .num {
                font-size: 1.3rem;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pony-burst-photo {
                width: 78px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
<div class="hearts-container" id="hearts"></div>
<div class="firework-layer" id="firework-layer"></div>

<div class="container">
    <div class="header">
        <h1>Li💗U</h1>
        <div class="subtitle">Our Love Journey Time Machine</div>
    </div>

    <div class="countdown-container" id="carousel">
        <div class="carousel-viewport">
            <div class="carousel-track" id="carousel-track"></div>
        </div>
        <div class="carousel-dots" id="carousel-dots"></div>
        <div class="carousel-hint">左右滑动切换</div>
    </div>

<!--     <div class="photo-container">
        <img id="slideshow-img" src="images/1.jpg" alt="Slideshow Image">
    </div> -->

    <div class="footer">Forever and Always</div>
</div>

<script>
    // 创建心形飘落效果
    function createHearts() {
        const heartsContainer = document.getElementById('hearts');
        const heartCount = 15;

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            // 随机位置和动画延迟
            const left = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = 8 + Math.random() * 5;
            const size = 15 + Math.random() * 20;

            heart.style.left = `${left}%`;
            heart.style.animationDelay = `${delay}s`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;

            heartsContainer.appendChild(heart);
        }
    }

    // 创建漂浮的心形图标
    function createFloatingHeart() {
        const countdownContainer = document.querySelector('.countdown-container');
        const heart = document.createElement('div');
        heart.innerHTML = '💖';
        heart.classList.add('heart-icon');

        // 随机位置
        const left = 20 + Math.random() * 60;
        heart.style.left = `${left}%`;

        countdownContainer.appendChild(heart);

        // 动画结束后移除元素
        setTimeout(() => {
            heart.remove();
        }, 3000);
    }

    function splitDuration(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        return {
            days: Math.floor(totalSeconds / 86400),
            hours: Math.floor((totalSeconds % 86400) / 3600),
            minutes: Math.floor((totalSeconds % 3600) / 60),
            seconds: totalSeconds % 60
        };
    }

    function renderTimeChips(parts) {
        return `
            <div class="time-chips">
                <div class="time-chip"><span class="num">${parts.days}</span><span class="label">天</span></div>
                <div class="time-chip"><span class="num">${pad2(parts.hours)}</span><span class="label">时</span></div>
                <div class="time-chip"><span class="num">${pad2(parts.minutes)}</span><span class="label">分</span></div>
                <div class="time-chip"><span class="num">${pad2(parts.seconds)}</span><span class="label">秒</span></div>
            </div>
        `;
    }

    function renderDurationInline(parts) {
        return `
            <span class="seg">${parts.days}天</span>
            <span class="seg">${pad2(parts.hours)}时</span>
            <span class="seg">${pad2(parts.minutes)}分</span>
            <span class="seg">${pad2(parts.seconds)}秒</span>
        `;
    }

    // 创建倒计时文本（按页面类型返回独立布局 HTML）
    function createCountdownTexts() {
        var targetDate = new Date(2024, 6, 20);
        var currentDate = new Date();
        var diffMilliseconds = targetDate.getTime() - currentDate.getTime();
        var diffDays = Math.abs(Math.floor(diffMilliseconds / (1000 * 60 * 60 * 24)));

        const pony = new Date(2026, 10, 10, 6, 13);
        var ponyParts = splitDuration(Math.abs(pony.getTime() - currentDate.getTime()));

        const birthDate = new Date(1990, 11, 31, 0, 0, 0);
        const hundredYearsDate = new Date(2090, 11, 31, 0, 0, 0);
        const livedParts = splitDuration(currentDate.getTime() - birthDate.getTime());
        const remainingParts = splitDuration(hundredYearsDate.getTime() - currentDate.getTime());

        return [
            {
                type: 'meet',
                html: `
                    <div class="slide slide-meet">
                        <div class="slide-eyebrow">💕 我们的见面</div>
                        <div class="slide-title">距 2024年07月20日</div>
                        <div class="slide-value">${diffDays}<span class="unit">天</span></div>
                        <div class="slide-meta">Love Journey Continues</div>
                    </div>
                `
            },
            {
                type: 'pony',
                html: `
                    <div class="slide slide-pony">
                        <div class="slide-eyebrow">🍼 小马（Pony）</div>
                        <div class="slide-title">出生：2026年11月10日 上午 6:13</div>
                        <div class="slide-meta">已经到来</div>
                        ${renderTimeChips(ponyParts)}
                    </div>
                `
            },
            {
                type: 'life',
                html: `
                    <div class="slide slide-life">
                        <div class="life-grid">
                            <div class="life-card">
                                <div class="life-card-icon">🎂</div>
                                <div class="life-card-label">出生至今</div>
                                <div class="life-card-value">${renderDurationInline(livedParts)}</div>
                            </div>
                            <div class="life-card">
                                <div class="life-card-icon">⏳</div>
                                <div class="life-card-label">活到100岁还剩</div>
                                <div class="life-card-value">${renderDurationInline(remainingParts)}</div>
                            </div>
                        </div>
                    </div>
                `
            }
        ];
    }

    const PONY_PHOTOS = ['pony/1.jpg', 'pony/2.jpg', 'pony/3.jpg'];
    const FIREWORK_COLORS = ['#ff6b9d', '#ffd166', '#7bdff2', '#b388ff', '#ff8fab', '#fff1a8', '#ff4d6d'];

    function launchFireworkBurst(layer, originX, originY) {
        const particleCount = 28 + Math.floor(Math.random() * 12);

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework-particle';

            const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.3;
            const distance = 80 + Math.random() * 160;
            const size = 4 + Math.random() * 7;
            const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
            const duration = 700 + Math.random() * 700;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;

            particle.style.left = `${originX}px`;
            particle.style.top = `${originY}px`;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.background = color;
            particle.style.boxShadow = `0 0 8px ${color}`;

            layer.appendChild(particle);

            const animation = particle.animate([
                {
                    transform: 'translate(-50%, -50%) scale(1)',
                    opacity: 1
                },
                {
                    transform: `translate(calc(-50% + ${dx * 0.55}px), calc(-50% + ${dy * 0.55}px)) scale(1.2)`,
                    opacity: 1,
                    offset: 0.35
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.2)`,
                    opacity: 0
                }
            ], {
                duration,
                easing: 'cubic-bezier(0.15, 0.75, 0.25, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => particle.remove();
        }
    }

    function launchPonyPhotoBurst(layer) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const photoCount = PONY_PHOTOS.length;

        PONY_PHOTOS.forEach((src, index) => {
            const img = document.createElement('img');
            img.className = 'pony-burst-photo';
            img.src = src;
            img.alt = '小马 Pony';

            const angle = (-Math.PI / 2) + (index - (photoCount - 1) / 2) * 0.9 + (Math.random() - 0.5) * 0.25;
            const distance = Math.min(window.innerWidth, window.innerHeight) * (0.22 + Math.random() * 0.12);
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance - 40;
            const rotate = (index - 1) * 18 + (Math.random() - 0.5) * 16;
            const delay = index * 80;

            img.style.left = `${centerX}px`;
            img.style.top = `${centerY}px`;

            layer.appendChild(img);

            const animation = img.animate([
                {
                    transform: 'translate(-50%, -50%) scale(0.15) rotate(0deg)',
                    opacity: 0
                },
                {
                    transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7}px)) scale(1.08) rotate(${rotate}deg)`,
                    opacity: 1,
                    offset: 0.35
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${rotate}deg)`,
                    opacity: 1,
                    offset: 0.7
                },
                {
                    transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy - 30}px)) scale(0.85) rotate(${rotate + 8}deg)`,
                    opacity: 0
                }
            ], {
                duration: 2600,
                delay,
                easing: 'cubic-bezier(0.16, 0.84, 0.28, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => img.remove();
        });
    }

    function celebratePony() {
        const layer = document.getElementById('firework-layer');
        if (!layer) return;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        launchFireworkBurst(layer, centerX, centerY);
        launchPonyPhotoBurst(layer);

        const sideBursts = [
            [centerX - 140, centerY - 60],
            [centerX + 140, centerY - 40],
            [centerX, centerY + 90]
        ];

        sideBursts.forEach(([x, y], index) => {
            setTimeout(() => {
                launchFireworkBurst(
                    layer,
                    x + (Math.random() - 0.5) * 40,
                    y + (Math.random() - 0.5) * 40
                );
            }, 180 + index * 160);
        });
    }

    function pad2(n) {
        return String(n).padStart(2, '0');
    }

    // 初始化页面
    function initPage() {
        createHearts();

        const carousel = document.getElementById('carousel');
        const track = document.getElementById('carousel-track');
        const dotsWrap = document.getElementById('carousel-dots');
        if (!carousel || !track || !dotsWrap) return;

        let currentIndex = 0;
        let slidesData = createCountdownTexts();
        let isDragging = false;
        let isWrapping = false;
        let startX = 0;
        let startY = 0;
        let deltaX = 0;
        let lockAxis = null; // 'x' | 'y' | null
        let dragWidth = 0;

        function buildSlides() {
            slidesData = createCountdownTexts();
            track.innerHTML = slidesData.map((item) => (
                `<div class="carousel-slide" data-type="${item.type}">${item.html}</div>`
            )).join('');

            dotsWrap.innerHTML = slidesData.map((_, idx) => (
                `<span class="carousel-dot${idx === currentIndex ? ' is-active' : ''}" data-index="${idx}"></span>`
            )).join('');
        }

        function updateDots() {
            dotsWrap.querySelectorAll('.carousel-dot').forEach((dot, idx) => {
                dot.classList.toggle('is-active', idx === currentIndex);
            });
        }

        function setTrackOffset(offsetPx, withTransition) {
            track.classList.toggle('is-dragging', !withTransition);
            track.style.transform = `translate3d(${offsetPx}px, 0, 0)`;
        }

        function clearClones() {
            track.querySelectorAll('.carousel-slide-clone').forEach((node) => node.remove());
        }

        function afterPageChange() {
            updateDots();
            createFloatingHeart();
            if (slidesData[currentIndex] && slidesData[currentIndex].type === 'pony') {
                celebratePony();
            }
        }

        function goToIndex(rawNextIndex) {
            const total = slidesData.length;
            if (!total) return;

            const previousIndex = currentIndex;
            const targetIndex = ((rawNextIndex % total) + total) % total;
            dragWidth = carousel.clientWidth || 1;

            if (previousIndex === targetIndex && rawNextIndex === previousIndex) {
                setTrackOffset(-currentIndex * dragWidth, true);
                return;
            }

            const wrappingForward = previousIndex === total - 1 && targetIndex === 0 && rawNextIndex === previousIndex + 1;
            const wrappingBackward = previousIndex === 0 && targetIndex === total - 1 && rawNextIndex === previousIndex - 1;

            // 最后一页继续左滑：克隆首页接在末尾，滑过去后再瞬间回到真实首页
            if (wrappingForward) {
                isWrapping = true;
                clearClones();
                const clone = track.children[0].cloneNode(true);
                clone.classList.add('carousel-slide-clone');
                track.appendChild(clone);
                void track.offsetWidth;
                setTrackOffset(-total * dragWidth, true);

                const finish = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    track.removeEventListener('transitionend', finish);
                    clearClones();
                    currentIndex = 0;
                    setTrackOffset(0, false);
                    isWrapping = false;
                    afterPageChange();
                };
                track.addEventListener('transitionend', finish);
                return;
            }

            // 第一页继续右滑：克隆末页插到最前，滑过去后再瞬间回到真实末页
            if (wrappingBackward) {
                isWrapping = true;
                clearClones();
                const clone = track.children[total - 1].cloneNode(true);
                clone.classList.add('carousel-slide-clone');
                track.insertBefore(clone, track.firstChild);
                setTrackOffset(-dragWidth, false);
                void track.offsetWidth;
                setTrackOffset(0, true);

                const finish = (event) => {
                    if (event.propertyName && event.propertyName !== 'transform') return;
                    track.removeEventListener('transitionend', finish);
                    clearClones();
                    currentIndex = total - 1;
                    setTrackOffset(-currentIndex * dragWidth, false);
                    isWrapping = false;
                    afterPageChange();
                };
                track.addEventListener('transitionend', finish);
                return;
            }

            currentIndex = targetIndex;
            setTrackOffset(-currentIndex * dragWidth, true);
            afterPageChange();
        }

        function refreshSlideContents() {
            slidesData = createCountdownTexts();
            const slideEls = track.querySelectorAll('.carousel-slide:not(.carousel-slide-clone)');
            slideEls.forEach((el, idx) => {
                if (!slidesData[idx]) return;
                el.dataset.type = slidesData[idx].type;
                el.innerHTML = slidesData[idx].html;
            });
        }

        function onPointerDown(clientX, clientY) {
            isDragging = true;
            lockAxis = null;
            startX = clientX;
            startY = clientY;
            deltaX = 0;
            dragWidth = carousel.clientWidth || 1;
            carousel.classList.add('is-dragging');
            setTrackOffset(-currentIndex * dragWidth + deltaX, false);
        }

        function onPointerMove(clientX, clientY, event) {
            if (!isDragging) return;

            const dx = clientX - startX;
            const dy = clientY - startY;

            if (!lockAxis) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                lockAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            }

            if (lockAxis === 'y') return;

            if (event && event.cancelable) event.preventDefault();
            deltaX = dx;
            setTrackOffset(-currentIndex * dragWidth + deltaX, false);
        }

        function onPointerUp() {
            if (!isDragging) return;
            isDragging = false;
            carousel.classList.remove('is-dragging');

            if (lockAxis !== 'x') {
                setTrackOffset(-currentIndex * dragWidth, true);
                lockAxis = null;
                deltaX = 0;
                return;
            }

            const threshold = Math.min(80, dragWidth * 0.18);
            let nextIndex = currentIndex;

            if (deltaX <= -threshold) {
                nextIndex = currentIndex + 1; // 左滑下一页（末页则回第一页）
            } else if (deltaX >= threshold) {
                nextIndex = currentIndex - 1; // 右滑上一页
            }

            goToIndex(nextIndex);
            lockAxis = null;
            deltaX = 0;
        }

        buildSlides();
        dragWidth = carousel.clientWidth || 1;
        setTrackOffset(0, false);
        updateDots();

        // 触摸滑动
        carousel.addEventListener('touchstart', (e) => {
            if (!e.touches[0]) return;
            onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        carousel.addEventListener('touchmove', (e) => {
            if (!e.touches[0]) return;
            onPointerMove(e.touches[0].clientX, e.touches[0].clientY, e);
        }, { passive: false });

        carousel.addEventListener('touchend', onPointerUp);
        carousel.addEventListener('touchcancel', onPointerUp);

        // 鼠标拖拽（桌面预览）
        carousel.addEventListener('mousedown', (e) => {
            e.preventDefault();
            onPointerDown(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            onPointerMove(e.clientX, e.clientY, e);
        });

        window.addEventListener('mouseup', onPointerUp);

        // 点击圆点跳转
        dotsWrap.addEventListener('click', (e) => {
            const dot = e.target.closest('.carousel-dot');
            if (!dot) return;
            const idx = Number(dot.dataset.index);
            if (Number.isNaN(idx)) return;
            goToIndex(idx);
        });

        // 窗口尺寸变化时重新对齐
        window.addEventListener('resize', () => {
            dragWidth = carousel.clientWidth || 1;
            setTrackOffset(-currentIndex * dragWidth, false);
        });

        // 每秒刷新各页动态时间（不打断滑动）
        setInterval(() => {
            if (isDragging || isWrapping) return;
            refreshSlideContents();
        }, 1000);

        const images = ['1.jpg', '2.jpg', '3.jpg', '4.jpg'];
        let imageIndex = 0;
        const imgElement = document.getElementById('slideshow-img');

        if (imgElement) {
            setInterval(() => {
                imageIndex = (imageIndex + 1) % images.length;
                imgElement.src = `images/${images[imageIndex]}`;
            }, 2000);
        }
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
