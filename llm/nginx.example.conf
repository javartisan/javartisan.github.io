# nginx 部署示例：把站点根指到本 html 目录
server {
    listen 8080;
    server_name localhost;

    # 改成你的实际路径，例如 /var/www/smollm-xuexi
    root /Users/tengdelong/PycharmProjects/SmolLM2-135M-sft/docs/学习路线/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 可选：关闭目录列表
    autoindex off;

    # 文本资源缓存（可按需调整）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
